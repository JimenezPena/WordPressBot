name: Comprobar Relatos WordPress

on:
  schedule:
    # Se ejecuta todos los días a las 8:00 AM UTC
    - cron: '0 17 * * *'
  # Permite también ejecutarlo de forma manual desde la pestaña "Actions" de GitHub
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código de tu repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configura tu entorno (ejemplo con Python, cámbialo si usas Node.js u otro)
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.1'

      # 3. Instala las dependencias que necesites (requests, google-generativeai, etc.)
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      # 4. Ejecuta tu script (asegúrate de pasarle la API Key de Gemini mediante Secrets)
      - name: Ejecutar script de revisión
        env:
          GEMINI_API_KEY: 		${{ secrets.GEMINI_API_KEY }}
          WP_ACCESS_TOKEN: 	${{ secrets.WP_ACCESS_TOKEN }}
          WP_USER: 				${{ secrets.WP_USER }}
          WP_PASSWORD: 		${{ secrets.WP_PASSWORD }}
          URL_FEED_RSS:  		${{ secrets.URL_FEED_RSS }}
          WP_API_URL:			${{ secrets.WP_API_URL }}
          AUTORES_EXCLUIDOS:	${{ secrets.AUTORES_EXCLUIDOS }}
        run: |
          python BotWordPressJuande.py

      # 5. Guarda los cambios del JSON en el repositorio de forma automática
      - name: Guardar JSON actualizado en Git
        run: |
          git config --global user.name "Bot de Relatos"
          git config --global user.email "bot@users.noreply.github.com"
          git add posts_procesados.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Actualizar registro de relatos [skip ci]" && git push)
